name: upper-build
on: 
    push:
        paths:
            - "github/workflows/upper-build.yaml"
            - "upper/**"
    workflow_dispatch: 
        
   
jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - run: go version
            - uses: actions/setup-go@v5
              with:
                go-version: 1.26.5
                cache-dependency-path: upper/go.sum

            
              