name: gh
on:
    push:
      paths:
        - ".github/workflows/gh.yaml"

    workflow_dispatch:
jobs:
    cli:
        runs-on: ubuntu-latest
        env:
            GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        steps:
            - uses: actions/checkout@v5
            - run: env
            - run: gh --version
            - run: gh auth status
            - run: gh repo list
            - run: gh issue list
            - run: gh workflow list
            - run: gh api /repos/:owner/:repo/actions/workflows

